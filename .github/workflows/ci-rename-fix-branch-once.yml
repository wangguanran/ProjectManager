name: Retarget fix PR to bug branch

on:
  push:
    branches:
      - fix/po-revert-reset-and-manifest-include

permissions:
  contents: write
  pull-requests: write

jobs:
  retarget-pr-212:
    name: retarget-pr-212
    runs-on: ubuntu-latest
    steps:
      - name: Open compliant bug/* PR, close #212, delete fix/*
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_BRANCH: fix/po-revert-reset-and-manifest-include
          NEW_BRANCH: bug/po-revert-reset-and-manifest-include
        run: |
          set -euo pipefail
          old_enc="${OLD_BRANCH//\//%2F}"

          existing="$(gh pr list --repo "${REPO}" --head "${NEW_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${existing}" ]; then
            new_pr="$(gh pr create --repo "${REPO}" --base main --head "${NEW_BRANCH}" \
              --title "fix(po): manifest include, PATCH prefix strip, and commit reset on revert" \
              --body "Supersedes #212 after retargeting to compliant bug/* branch naming.")"
            echo "Created ${new_pr}"
          else
            echo "Open PR already exists for ${NEW_BRANCH}: #${existing}"
          fi

          if gh pr view 212 --repo "${REPO}" --json state --jq .state | grep -q '^OPEN$'; then
            gh pr close 212 --repo "${REPO}" \
              --comment "Closed in favor of bug/${NEW_BRANCH#bug/} to satisfy validate-main-source-branch."
          fi

          gh api -X DELETE "repos/${REPO}/git/refs/heads/${old_enc}" || true

          echo "Retarget complete for ${REPO}"
