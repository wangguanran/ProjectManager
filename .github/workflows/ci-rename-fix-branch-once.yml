name: Retarget fix PR to bug branch

on:
  push:
    branches:
      - fix/po-revert-reset-and-manifest-include

permissions:
  contents: write
  pull-requests: write

jobs:
  retarget-pr-212:
    name: retarget-pr-212
    runs-on: ubuntu-latest
    steps:
      - name: Point PR #212 at bug/* and remove fix/* branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_BRANCH: fix/po-revert-reset-and-manifest-include
          NEW_BRANCH: bug/po-revert-reset-and-manifest-include
        run: |
          set -euo pipefail
          old_enc="${OLD_BRANCH//\//%2F}"

          gh pr edit 212 --repo "${REPO}" --head "${NEW_BRANCH}"
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${old_enc}"

          echo "PR #212 now tracks ${NEW_BRANCH}; deleted ${OLD_BRANCH}"
